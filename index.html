<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" id="meta-desc" content="Clinical Articles & Research Showcase">
<title id="page-title">My Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231668dc'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white'%3EU%3C/text%3E%3C/svg%3E">
<script src="data.js"></script>
<style>
:root{--accent:#1668dc;--ink:#0f1f3d;--sub:#54627a;--line:#e6ebf2;--bg:#f6f8fc;--card:#ffffff;--soft:#eef3fb;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand .dot{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{padding:8px 14px;border-radius:9px;font-size:15px;color:var(--sub);font-weight:500}
.nav-links a:hover{background:var(--soft);color:var(--ink)}
.nav-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff}
.nav-search input{border:none;outline:none;width:150px;font-size:14px;background:transparent;color:var(--ink)}
.nav-search svg{flex:none;color:var(--sub)}
.menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px}
.menu-btn span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;border-radius:2px}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b2e5b,#1668dc 60%,#1f86d8);color:#fff;padding:74px 0 64px}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 380px at 80% 0%,rgba(255,255,255,.16),transparent)}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:.5px;max-width:780px}
.hero p{margin-top:18px;font-size:clamp(15px,2.4vw,18px);opacity:.92;max-width:740px;white-space:pre-wrap}
.hero .hero-sub{margin-top:16px;font-weight:600;font-size:clamp(16px,2.6vw,20px);opacity:.95;max-width:780px;white-space:pre-wrap}
.hero.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,42,.5),rgba(6,18,42,.64));z-index:0}
.hero-actions{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:11px;font-weight:600;font-size:15px;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn-light{background:#fff;color:var(--accent)}
.btn-light:hover{box-shadow:0 8px 22px rgba(0,0,0,.18)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.stats{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:18px 20px}
.stat .num{font-size:30px;font-weight:800}
.stat .lab{font-size:13px;opacity:.85;margin-top:2px}

/* sections */
section{padding:64px 0}
.section-head{margin-bottom:30px}
.section-head h2{font-size:clamp(24px,4vw,32px);font-weight:800}
.section-head .lead{color:var(--sub);margin-top:8px;font-size:16px}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.feature{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.feature .ico{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.feature h3{font-size:17px;margin-bottom:6px}
.feature p{color:var(--sub);font-size:14.5px}

/* library */
.lib-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:22px}
.search-box{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:11px;padding:9px 14px;background:#fff;flex:1;min-width:200px;max-width:380px}
.search-box input{border:none;outline:none;width:100%;font-size:15px;background:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--sub);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(20,50,90,.13)}
.card-cover{height:172px;background:linear-gradient(135deg,#dde7f5,#cdddf0);overflow:hidden;position:relative}
.card-cover img{width:100%;height:100%;object-fit:cover}
.card-badge{position:absolute;top:12px;left:12px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px}
.card-body{padding:16px 18px 20px;flex:1;display:flex;flex-direction:column}
.card-meta{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.card-meta b{color:var(--accent)}
.card h3{font-size:16.5px;font-weight:700;line-height:1.45;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .abs{font-size:13.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card-tags{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;background:var(--soft);color:var(--accent);padding:3px 9px;border-radius:6px;font-weight:600}

.empty{text-align:center;padding:70px 20px;color:var(--sub)}
.empty .big{font-size:48px;margin-bottom:14px}
.empty h3{color:var(--ink);margin-bottom:8px}
.empty a{color:var(--accent);font-weight:700}

/* about */
.about{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about .body{white-space:pre-wrap;color:var(--sub);font-size:16px;max-width:820px}

/* footer */
footer{background:#0c1c38;color:#aebcd6;padding:40px 0}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center}
.foot a{color:#9fb4d6}
.foot a:hover{color:#fff}
.foot .mail{color:#9fb4d6}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,22,46,.6);backdrop-filter:blur(4px);display:none;overflow:auto;padding:24px}
.overlay.show{display:block}
.modal{max-width:860px;margin:auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal-head{position:relative}
.modal-cover{background:linear-gradient(135deg,#dde7f5,#cdddf0);overflow:hidden}
.modal-cover img{width:100%;height:auto;max-height:500px;object-fit:contain}
.modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;font-size:22px;cursor:pointer;display:grid;place-items:center}
.modal-body{padding:26px 30px 34px}
.modal-body .cat{color:var(--accent);font-weight:700;font-size:14px}
.modal-body h2{font-size:24px;margin:6px 0 4px;line-height:1.35}
.modal-body .en{color:var(--sub);font-size:14.5px;font-style:italic;margin-bottom:12px}
.modal-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--sub);padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0}
.modal-meta b{color:var(--ink)}
.block-title{font-weight:700;margin:18px 0 8px;font-size:16px}
.modal-body .abs{color:#33425c;font-size:15px}
.findings{list-style:none}
.findings li{position:relative;padding-left:26px;margin:7px 0;color:#33425c;font-size:14.5px}
.findings li::before{content:"";position:absolute;left:4px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.gallery{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.gallery .gal-img{border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:#fff;transition:box-shadow .15s}
.gallery .gal-img:hover{box-shadow:0 6px 18px rgba(20,50,90,.13)}
.gallery .gal-img img{width:100%;height:auto;display:block}
.gallery .gal-img .cap{padding:8px 12px;font-size:13px;color:var(--sub);text-align:center;line-height:1.5}
.gallery.layout-auto .gi-auto{flex:1 1 240px;max-width:320px}
.gallery.layout-auto .gi-small{flex:1 1 160px;max-width:33%}
.gallery.layout-auto .gi-medium{flex:1 1 340px;max-width:50%}
.gallery.layout-auto .gi-large{flex:1 1 500px;max-width:66%}
.gallery.layout-auto .gi-full{flex:1 1 100%;max-width:100%}
.gallery.layout-single .gal-img{flex:1 1 100%;width:100%;max-width:100%}
.gallery.layout-two .gal-img{flex:1 1 50%;max-width:50%}
.gallery.layout-three .gal-img{flex:1 1 33.33%;max-width:33.33%}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.links-row{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}

/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lb.show{display:flex}
.lb img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* admin float */
.admin-fab{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--accent);color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 24px rgba(22,104,220,.45);cursor:pointer;border:none}
.admin-fab svg{width:24px;height:24px}

@media(max-width:860px){
  .nav-links,.nav-search{display:none}
  .menu-btn{display:block}
  .hero{padding:56px 0 46px}
  .modal-cover img{max-height:280px}
  .modal-body{padding:20px 18px 26px}
  .gallery.layout-two .gal-img,.gallery.layout-three .gal-img{flex:1 1 100%;max-width:100%}
  .gallery.layout-auto .gi-small,.gallery.layout-auto .gi-medium,.gallery.layout-auto .gi-large{flex:1 1 100%;max-width:100%}
}
.mobile-drawer{position:fixed;inset:0;z-index:80;background:rgba(10,22,46,.5);display:none}
.mobile-drawer.show{display:block}
.drawer-panel{position:absolute;right:0;top:0;height:100%;width:260px;background:#fff;padding:22px;transform:translateX(100%);transition:transform .25s}
.mobile-drawer.show .drawer-panel{transform:translateX(0)}
.drawer-panel a{display:block;padding:12px 8px;font-size:16px;border-bottom:1px solid var(--line);color:var(--ink)}
.drawer-search{margin-top:14px}
.drawer-search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#home" class="brand"><span class="dot" id="brand-dot">U</span><span id="brand-name">My Library</span></a>
    <nav class="nav-links" id="nav-links">
      <a href="#home">Home</a>
      <a href="#intro">About</a>
      <a href="#library">Library</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="nav-search" id="nav-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="search-input" placeholder="Search articles..." autocomplete="off">
    </div>
    <button class="menu-btn" id="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="mobile-drawer" id="drawer">
  <div class="drawer-panel">
    <a href="#home">Home</a>
    <a href="#intro">About</a>
    <a href="#library">Library</a>
    <a href="#contact">Contact</a>
    <a href="admin.html">Admin Panel</a>
    <div class="drawer-search"><input id="search-input-m" placeholder="Search articles..." autocomplete="off"></div>
  </div>
</div>

<main id="main"></main>

<footer>
  <div class="wrap foot">
    <span id="footer-text">&copy; My Library</span>
    <span><a href="admin.html">Admin Panel</a> &middot; <a class="mail" id="footer-mail"></a></span>
  </div>
</footer>

<button class="admin-fab" onclick="location.href='admin.html'" title="Admin Panel" aria-label="Admin Panel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3 3 3 0 0 0-2.5 5 3 3 0 0 0 0 5 3 3 0 0 0 2.5 5 3 3 0 0 0 6 0 3 3 0 0 0 2.5-5 3 3 0 0 0 0-5A3 3 0 0 0 15 5a3 3 0 0 0-3-3Z"/><path d="M9 12h6M9 16h6"/></svg>
</button>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="lb" id="lb"><img id="lb-img" alt=""></div>

<script>
const LS_KEY='site_data_v2';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getDataDefault(){return (window.SITE_DATA||{settings:{},categories:[],articles:[]});}
/* persistence: IndexedDB with localStorage fallback (handles large image data) */
function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open('site_db',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbGet(k){return new Promise(function(res,rej){idbOpen().then(function(db){var tx=db.transaction('kv','readonly');var rq=tx.objectStore('kv').get(k);rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){rej(rq.error);};}).catch(rej);});}
function storeGet(){if(typeof indexedDB==='undefined'){try{var o=JSON.parse(localStorage.getItem(LS_KEY));if(o&&o.settings)return Promise.resolve(o);}catch(e){}return Promise.resolve(null);}return idbGet(LS_KEY).then(function(v){return v||null;}).catch(function(){return null;});}
let D,s;
let curCat='all', curQuery='';
function applySettings(){
  s=D.settings||{};
  document.documentElement.style.setProperty('--accent',s.accent||'#1668dc');
  document.title=s.siteName||'My Library';
  document.getElementById('meta-desc').setAttribute('content',s.siteSub||'');
  document.getElementById('brand-name').textContent=s.siteName||'My Library';
  document.getElementById('brand-dot').textContent=(s.siteName||'U').charAt(0).toUpperCase();
  document.getElementById('footer-text').textContent=s.footerText||'';
  const fm=document.getElementById('footer-mail');
  if(s.contactEmail){fm.textContent=s.contactEmail;fm.href='mailto:'+s.contactEmail;}else{fm.style.display='none';}
}
function init(data){D=data;applySettings();render();}

function renderHero(){
  const stats=(s.stats||[]).map(st=>`<div class="stat"><div class="num">${esc(st.num)}</div><div class="lab">${esc(st.lab)}</div></div>`).join('');
  const hasImg=!!s.heroImage;
  const bg=hasImg?` style="background-image:url('${String(s.heroImage).replace(/'/g,'%27')}');background-size:cover;background-position:center"`:'';
  const sub=s.siteSub?`<p class="hero-sub">${esc(s.siteSub)}</p>`:'';
  return `<section class="hero${hasImg?' has-img':''}" id="home"${bg}><div class="wrap">
    <h1>${esc(s.heroTitle||'')}</h1>
    ${sub}
    <p>${esc(s.heroDesc||'')}</p>
    <div class="hero-actions">
      <a class="btn btn-light" href="#library">Browse Library &rarr;</a>
      <a class="btn btn-ghost" href="admin.html">Admin Panel</a>
    </div>
    ${stats?`<div class="stats">${stats}</div>`:''}
  </div></section>`;
}
function renderIntro(){
  if(s.showIntro===false)return '';
  const feats=(s.features||[]).map(f=>`<div class="feature"><div class="ico">${esc(f.icon||'&#10022;')}</div><h3>${esc(f.title)}</h3><p>${esc(f.desc)}</p></div>`).join('');
  return `<section class="intro" id="intro"><div class="wrap">
    <div class="section-head"><h2>${esc(s.introTitle||'')}</h2></div>
    ${s.introBody?`<p class="body" style="color:var(--sub);white-space:pre-wrap;margin-bottom:26px;font-size:16px">${esc(s.introBody)}</p>`:''}
    ${feats?`<div class="features">${feats}</div>`:''}
  </div></section>`;
}
function renderAbout(){
  if(s.showAbout===false||!s.aboutText)return '';
  const emailHtml=s.contactEmail?`<div style="margin-top:20px"><a href="mailto:${esc(s.contactEmail)}" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:15px">&#9993; ${esc(s.contactEmail)}</a></div>`:'';
  return `<section class="about" id="contact"><div class="wrap">
    <div class="section-head"><h2>Contact</h2></div>
    <div class="body">${esc(s.aboutText)}</div>
    ${emailHtml}
  </div></section>`;
}
function renderLibrary(){
  const cats=D.categories||[];
  const chips=`<span class="chip ${curCat==='all'?'on':''}" data-cat="all">All</span>`+
    cats.map(c=>`<span class="chip ${curCat===c.id?'on':''}" data-cat="${esc(c.id)}">${esc(c.icon||'')}${esc(c.name)}</span>`).join('');
  let arts=(D.articles||[]).filter(a=>a.visible!==false);
  if(curCat!=='all')arts=arts.filter(a=>a.catId===curCat);
  if(curQuery){const q=curQuery.toLowerCase();arts=arts.filter(a=>[a.title,a.titleEn,a.authors,a.journal,(a.tags||[]).join(','),a.abstract].join(' ').toLowerCase().includes(q));}
  arts.sort((a,b)=>(b.year||0)-(a.year||0));
  const cards=arts.map(a=>{
    const cat=cats.find(c=>c.id===a.catId);
    const cover=a.cover||'assets/placeholder.svg';
    const tags=(a.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    return `<div class="card" data-id="${esc(a.id)}">
      <div class="card-cover"><img src="${esc(cover)}" alt="" loading="lazy" onerror="this.src='assets/placeholder.svg'"><span class="card-badge">${esc(cat?cat.name:'Uncategorized')}</span></div>
      <div class="card-body">
        <div class="card-meta"><b>${esc(a.journal||'')}</b>${a.year?' &middot; '+esc(a.year):''}</div>
        <h3>${esc(a.title||'Untitled')}</h3>
        <div class="abs">${esc(a.abstract||'')}</div>
        ${tags?`<div class="card-tags">${tags}</div>`:''}
      </div>
    </div>`;
  }).join('');
  return `<section class="library" id="library"><div class="wrap">
    <div class="section-head"><h2>Library</h2><p class="lead">${(D.articles||[]).length} articles total</p></div>
    <div class="lib-bar">
      <div class="chips" id="chips">${chips}</div>
      <span class="count" id="count">${arts.length} results</span>
    </div>
    ${arts.length?`<div class="grid">${cards}</div>`:`<div class="empty"><div class="big">&#128203;</div><h3>No content yet</h3><p>Please go to the admin panel to add categories and articles.<br><a href="admin.html">&rarr; Go to Admin Panel</a></p></div>`}
  </div></section>`;
}
function render(){
  document.getElementById('main').innerHTML=renderHero()+renderIntro()+renderLibrary()+renderAbout();
  bind();
}
function bind(){
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{curCat=c.dataset.cat;render();document.getElementById('library').scrollIntoView();});
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openArticle(c.dataset.id));
  document.getElementById('chips')&&0;
}
function normGalItem(g){if(typeof g==='string')return{src:g,caption:'',size:'auto'};return{src:g.src||'',caption:g.caption||'',size:g.size||'auto'};}
function openArticle(id){
  const a=(D.articles||[]).find(x=>x.id===id);if(!a)return;
  const cat=(D.categories||[]).find(c=>c.id===a.catId);
  const galItems=(a.gallery||[]).map(normGalItem);
  const layout=a.galleryLayout||'auto';
  const galHtml=galItems.length?'<div class="block-title">Images</div><div class="gallery layout-'+esc(layout)+'" id="gallery">'+
    galItems.map(function(g){
      var cls=(layout==='auto'||!layout)?'gi-'+esc(g.size||'auto'):'gi-auto';
      return '<div class="gal-img '+cls+'"><img src="'+esc(g.src)+'" alt="" loading="lazy" onerror="this.parentElement.style.display=\'none\'" data-full="'+esc(g.src)+'">'+(g.caption?'<div class="cap">'+esc(g.caption)+'</div>':'')+'</div>';
    }).join('')+'</div>':'';
  const find=(a.findings||[]).map(f=>`<li>${esc(f)}</li>`).join('');
  const tags=(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const links=[];
  if(a.link)links.push(`<a class="btn" style="background:var(--accent);color:#fff" href="${esc(a.link)}" target="_blank" rel="noopener">View Original &#8599;</a>`);
  if(a.doi)links.push(`<a class="btn" style="background:var(--soft);color:var(--accent)" href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">DOI: ${esc(a.doi)}</a>`);
  document.getElementById('modal').innerHTML=`
    <div class="modal-head">
      <div class="modal-cover"><img src="${esc(a.cover||'assets/placeholder.svg')}" alt="" onerror="this.src='assets/placeholder.svg'"></div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="cat">${esc(cat?cat.name:'Uncategorized')}</div>
      <h2>${esc(a.title||'Untitled')}</h2>
      ${a.titleEn?`<div class="en">${esc(a.titleEn)}</div>`:''}
      <div class="modal-meta">
        ${a.authors?`<span><b>Authors:</b> ${esc(a.authors)}</span>`:''}
        ${a.journal?`<span><b>Journal:</b> ${esc(a.journal)}</span>`:''}
        ${a.year?`<span><b>Year:</b> ${esc(a.year)}</span>`:''}
        ${a.doi?`<span><b>DOI:</b> ${esc(a.doi)}</span>`:''}
      </div>
      ${a.abstract?`<div class="block-title">What This Study Shows &amp; Clinical Significance</div><div class="abs">${esc(a.abstract)}</div>`:''}
      ${find?`<div class="block-title">Results</div><ul class="findings">${find}</ul>`:''}
      ${galHtml}
      ${tags?`<div class="tags">${tags}</div>`:''}
      ${links.length?`<div class="links-row">${links.join('')}</div>`:''}
    </div>`;
  document.getElementById('overlay').classList.add('show');
  document.querySelectorAll('#gallery img').forEach(img=>img.onclick=()=>showLb(img.dataset.full));
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
function showLb(src){const i=document.getElementById('lb-img');i.src=src;document.getElementById('lb').classList.add('show');}
function closeLb(){document.getElementById('lb').classList.remove('show');}

document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};
document.getElementById('lb').onclick=closeLb;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeLb();}});

function doSearch(v){curQuery=(v||'').trim();render();}
const si=document.getElementById('search-input');
if(si)si.oninput=()=>doSearch(si.value);
const sm=document.getElementById('search-input-m');
if(sm)sm.oninput=()=>{doSearch(sm.value);document.getElementById('drawer').classList.remove('show');document.getElementById('library').scrollIntoView();};

const drawer=document.getElementById('drawer');
document.getElementById('menu-btn').onclick=()=>drawer.classList.add('show');
drawer.onclick=e=>{if(e.target.id==='drawer')drawer.classList.remove('show');};

/* Robust init: render immediately with localStorage or default data,
   then upgrade from IndexedDB only if it's NEWER than the server data.
   This prevents stale local data from overriding freshly published content. */
function serverTS(){return (window.SITE_DATA&&window.SITE_DATA.lastSaved)||0;}
function tryLocalData(){
  try{
    var o=JSON.parse(localStorage.getItem(LS_KEY));
    if(o&&o.settings){
      var lv=o.lastSaved||0;
      if(lv>=serverTS())return o;  /* local is newer or same — use it */
    }
  }catch(e){}
  return null;  /* fall back to server data */
}
var _local=tryLocalData();
init(_local||getDataDefault());  /* render immediately — never blank */
if(typeof indexedDB!=='undefined'){
  idbGet(LS_KEY).then(function(v){
    if(v&&v.settings){
      var iv=v.lastSaved||0;
      if(iv>=serverTS()){init(v);}  /* only upgrade if IDB is newer or same */
    }
  }).catch(function(){});
  /* safety: if IDB hangs, page already rendered with server data */
}
</script>
