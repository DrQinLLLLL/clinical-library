<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e5b"/>
      <stop offset="1" stop-color="#124a8f"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g filter="url(#glow)" stroke="#7fb4ff" fill="none" stroke-linecap="round">
    <path d="M80 420 C 200 380, 240 300, 360 280 S 560 260, 720 180" stroke-width="10" opacity="0.9"/>
    <path d="M220 350 C 300 330, 330 280, 420 250" stroke-width="6" opacity="0.8"/>
    <path d="M360 280 C 420 250, 460 240, 540 190" stroke-width="5" opacity="0.7"/>
    <path d="M480 250 C 540 230, 580 210, 640 150" stroke-width="4" opacity="0.6"/>
    <path d="M560 260 C 620 240, 660 220, 700 260" stroke-width="3" opacity="0.5"/>
  </g>
  <g fill="#bcd6f5">
    <circle cx="360" cy="280" r="5"/><circle cx="420" cy="250" r="4"/><circle cx="500" cy="236" r="4"/>
    <circle cx="580" cy="206" r="3.5"/><circle cx="650" cy="160" r="3"/><circle cx="300" cy="322" r="4"/>
    <circle cx="230" cy="352" r="3.5"/><circle cx="700" cy="200" r="4"/><circle cx="460" cy="243" r="3"/>
  </g>
  <text x="40" y="470" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#bcd6f5" opacity="0.8">示例占位图（可在后台上传真实图片替换）</text>
</svg>
